services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/url_shortener
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: 100
      REDIRECT_RATE_LIMIT_PER_MINUTE: 600
      WEB_CONCURRENCY: 2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
